[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neuops"
dynamic = ["version"]
description = "NeuOps (master): node pool, task forwarding, experiments, AI ops tickets and self-learning knowledge base"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "NeuOps contributors" },
]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "Flask>=3.0,<4",
    "python-dotenv>=1.0,<2",
    "waitress>=3.0,<4",
    "bcrypt>=4.0,<6",
    "cryptography>=42,<48",
    "requests>=2.28,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.dynamic]
version = { attr = "neuops.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neuops.master" = [
    "migrations/*.sql",
    "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
